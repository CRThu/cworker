name: Publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Build Binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin
          go build -ldflags="-s -w" -o bin/cw.exe .
      - name: Generate SHA-256 Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 bin/cw.exe).Hash.ToLower()
          "$hash  cw.exe" | Set-Content -Path bin/cw.exe.sha256 -Encoding utf8
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/cw.exe
            bin/cw.exe.sha256
