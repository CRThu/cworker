name: Publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Frontend Assets
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Build Binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin
          go build -ldflags="-s -w" -o bin/cw.exe .
      - name: Generate SHA-256 Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 bin/cw.exe).Hash.ToLower()
          "$hash  cw.exe" | Set-Content -Path bin/cw.exe.sha256 -Encoding utf8
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/cw.exe
            bin/cw.exe.sha256
            install.ps1
